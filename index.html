<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <title>Dessert Menu</title>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4">
        <h1 class="text-4xl font-bold text-center mt-10">Dessert Menu</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-10">
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-2xl font-semibold">Chocolate Cake</h2>
                <p class="mt-2 text-gray-600">Rich and moist chocolate cake topped with creamy chocolate frosting.</p>
                <a href="https://wa.me/?text=I'd like to order the Chocolate Cake!" class="inline-block mt-4 bg-blue-500 text-white rounded px-4 py-2">Order Now</a>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-2xl font-semibold">Vanilla Ice Cream</h2>
                <p class="mt-2 text-gray-600">Creamy vanilla ice cream served with chocolate syrup.</p>
                <a href="https://wa.me/?text=I'd like to order the Vanilla Ice Cream!" class="inline-block mt-4 bg-blue-500 text-white rounded px-4 py-2">Order Now</a>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-2xl font-semibold">Fruit Tart</h2>
                <p class="mt-2 text-gray-600">A delightful tart filled with fresh fruits and pastry cream.</p>
                <a href="https://wa.me/?text=I'd like to order the Fruit Tart!" class="inline-block mt-4 bg-blue-500 text-white rounded px-4 py-2">Order Now</a>
            </div>
        </div>
    </div>
</body>
</html>
